name: Technical E1.2A-R1 Q1 admission audit
on:
  push:
    branches: ['research/technical-model-v1']
    paths: ['technical/e1_q1_audit.py','technical/e1_q1_r1.py','tests/test_technical_e1_q1_r1.py','.github/workflows/technical-e1-q1-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen engine and plan unchanged
        run: git diff --exit-code a4e103d5e29c76636fe68c91c433455ff9c45c88 HEAD -- technical/indicators.py technical/signals.py technical/quality.py technical/data.py technical/model_a.py technical/model_b.py technical/model_b_data.py technical/model_c.py technical/model_c_r1.py technical/model_d.py technical/model_e0.py technical/e0_r2_acceleration.py technical/e0_r3_index.py technical/e0_r3_store.py technical/e0_r3_validate.py docs/technical-model-v1.0-E-research-plan.md
      - name: Verify legacy worker and count semantics unchanged
        run: |
          python - <<'PY'
          import ast,subprocess,pathlib
          p="technical/e1_q1_audit.py"
          a=ast.parse(subprocess.check_output(["git","show","3e866811dc7517a6a015900bb5f54cfa62776a14:"+p],text=True));b=ast.parse(pathlib.Path(p).read_text())
          for n in ("worker","count_row","population_vol"):
              assert ast.dump(next(x for x in a.body if isinstance(x,ast.FunctionDef) and x.name==n))==ast.dump(next(x for x in b.body if isinstance(x,ast.FunctionDef) and x.name==n)),n
          PY
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_technical*.py' -v
      - name: Read permanent frozen manifest
        run: |
          git fetch origin frozen/e1-manifest-v1
          test "$(git rev-parse FETCH_HEAD)" = 12973ce32c66429ff0026e0392576aa29031d436
          mkdir -p e1-manifest
          git show FETCH_HEAD:research/e1/sample-manifest.json > e1-manifest/sample-manifest.json
          python -m technical.e1_freeze_manifest e1-manifest/sample-manifest.json
      - name: Restore original partial checkpoint ledger
        uses: actions/download-artifact@v4
        with:
          name: e1-q1-audit-evidence
          path: e1-legacy
          run-id: '46110956700'
          github-token: ${{ github.token }}
      - name: Full 2023Q1 feature and admission audit
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python -m technical.e1_q1_audit e1-manifest/sample-manifest.json
      - name: Save aggregate audit and checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-q1-audit-evidence
          path: |
            e1-q1-ledger/*.json
            e1-q1-audit/*.json
          if-no-files-found: ignore
          retention-days: 14
