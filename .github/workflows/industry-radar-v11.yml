name: Industry radar V1.1 research
on:
  push:
    branches: [research/industry-radar-v1.1]
    paths: [".github/workflows/industry-radar-v11.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile V1.1 modules
        run: python -m py_compile radar/model_v11.py radar/build_v11.py radar/view_v11.py
      - name: Run V1.1 scanner and matched historical validation
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python radar/build_v11.py --output "${{ runner.temp }}/radar-v11"
      - name: Check generated offline HTML script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,os
          p=Path(os.environ["RUNNER_TEMP"])/"radar-v11"
          a=(p/"radar.html").read_text()
          s=re.findall(r"<script>(.*?)</script>",a,re.S)
          assert len(s)==1
          (p/"check.js").write_text(s[0])
          PY
          node --check "${{ runner.temp }}/radar-v11/check.js"
          rm "${{ runner.temp }}/radar-v11/check.js"
      - name: Upload derived research report
        uses: actions/upload-artifact@v4
        with:
          name: industry-radar-v11
          path: ${{ runner.temp }}/radar-v11
          retention-days: 3
          if-no-files-found: error
