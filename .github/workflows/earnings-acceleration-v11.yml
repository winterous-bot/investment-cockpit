name: Earnings acceleration V1.1 matched validation
on:
  push:
    branches: [research/earnings-acceleration-v1]
    paths: ['.github/workflows/earnings-acceleration-v11.yml']
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression and matching tests
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile acceleration/matching.py acceleration/matched_build.py
          test "$(git hash-object acceleration/acceleration_model.py)" = 5e357c09d741cb291599b6016a229d7f15f54e13
          test "$(git hash-object acceleration/matching.py)" = 35eea3a45cccf94f6fb7e5bb0dbbed0202860919
      - name: Historical matched controls, future growth and sampled price risk (full SW .SI codes)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python acceleration/matched_build.py --asof 20261125 --output "$RUNNER_TEMP/acceleration-v11"
      - uses: actions/upload-artifact@v4
        with:
          name: earnings-acceleration-v11-validation
          path: ${{ runner.temp }}/acceleration-v11/validation.json
          retention-days: 3
          if-no-files-found: error
      - name: Clean temporary data
        if: always()
        run: rm -rf "$RUNNER_TEMP/acceleration-v11"
