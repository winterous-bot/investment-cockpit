name: Growth scanner V1.0 research
on:
  push:
    branches: [research/growth-scanner-v1]
    paths: ['.github/workflows/growth-scanner-research.yml']
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test financial formulas and existing research modules
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile growth/build.py growth/growth_model.py
          node --check growth/seal.mjs
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path("growth/view.html").read_text()
          s=re.findall(r"<script>(.*?)</script>",text,re.S)
          assert len(s)==1
          Path("/tmp/growth-view.js").write_text(s[0])
          PY
          node --check /tmp/growth-view.js
      - name: Fetch and verify current disclosed financials
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python growth/build.py --asof 20261125 --output "$RUNNER_TEMP/growth-research"
      - name: Encrypt candidate data using existing private key
        env:
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
        run: node growth/seal.mjs "$RUNNER_TEMP/growth-research"
      - name: Publish only encrypted report and aggregate validation
        uses: actions/upload-artifact@v4
        with:
          name: growth-scanner-v1
          path: |
            ${{ runner.temp }}/growth-research/growth.html
            ${{ runner.temp }}/growth-research/validation.json
          retention-days: 3
          if-no-files-found: error
      - name: Remove private temporary outputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/growth-research"
