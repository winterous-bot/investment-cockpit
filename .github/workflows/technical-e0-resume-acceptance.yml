name: Technical E0 R3 cross-run resume acceptance
on:
  push:
    branches: ['research/technical-model-v1']
    paths: ['technical/e0_resume_acceptance.py','.github/workflows/technical-e0-resume-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact original R3 engine
        uses: actions/checkout@v4
        with:
          ref: a4e103d5e29c76636fe68c91c433455ff9c45c88
          path: r3-baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original engine regression tests
        working-directory: r3-baseline
        run: python -m unittest discover -s tests -p 'test_technical*.py' -v
      - name: Restore original 30 checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: r3-aggregate-ledger
          path: r3-original-ledger
          run-id: '46106077847'
          github-token: ${{ github.token }}
      - name: Resume 20 and recompute 10 with pinned original engine
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python technical/e0_resume_acceptance.py r3-baseline r3-original-ledger r3-restored-ledger
      - name: Save recovery acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-resume-acceptance
          path: |
            r3-restored-ledger/*.json
            resume-acceptance.json
          if-no-files-found: ignore
          retention-days: 14
