name: Growth scanner V1.3 reverse DCF validation
on:
  push:
    branches: [research/growth-scanner-v1]
    paths: ['.github/workflows/growth-reverse-dcf.yml']
permissions:
  contents: read
  actions: read
jobs:
  reverse-dcf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression and syntax tests
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile growth/reverse_dcf.py growth/reverse_dcf_build.py
          python - <<'PY'
          import re
          from pathlib import Path
          s=re.findall(r"<script>(.*?)</script>",Path("growth/view.html").read_text(),re.S)
          assert len(s)==1 and "hist_discount" not in s[0]
          Path("/tmp/growth-view.js").write_text(s[0])
          PY
          node --check /tmp/growth-view.js
      - uses: actions/download-artifact@v4
        with:
          name: growth-scanner-v12
          run-id: 45746290422
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/growth-source
      - name: Read prior authenticated financial snapshot
        env:
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/growth-v13"
          node growth/reuse_snapshot.mjs "$RUNNER_TEMP/growth-source/growth.html" "$RUNNER_TEMP/growth-v13/snapshot.json" growth-scanner-v1.2
      - name: Verify real FCFF, EBIT, debt and ROIC; run reverse DCF scenarios
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python growth/reverse_dcf_build.py "$RUNNER_TEMP/growth-v13"
      - name: Encrypt report with existing key
        env:
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
        run: node growth/seal.mjs "$RUNNER_TEMP/growth-v13"
      - uses: actions/upload-artifact@v4
        with:
          name: growth-scanner-v13
          path: |
            ${{ runner.temp }}/growth-v13/growth.html
            ${{ runner.temp }}/growth-v13/validation.json
          retention-days: 3
          if-no-files-found: error
      - name: Clean temporary financial data
        if: always()
        run: rm -rf "$RUNNER_TEMP/growth-v13" "$RUNNER_TEMP/growth-source"
