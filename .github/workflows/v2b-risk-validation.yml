name: V2.0b Forward Risk Validation (research only)
on:
  push:
    branches: [research/v2b-risk-validation-20261125]
    paths:
      - ".github/workflows/v2b-risk-validation.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: v2b-risk-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frozen definition regression tests
        run: python -m unittest discover -s tests -v
      - name: Reuse previous historical aggregate shards (no raw equity prices)
        uses: actions/download-artifact@v4
        with:
          pattern: v2-aggregates-*
          merge-multiple: true
          run-id: 45016779352
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/v2b-shards
      - name: Inspect available year shards
        run: |
          ls -l "${{ runner.temp }}/v2b-shards"
          test -n "$(find "${{ runner.temp }}/v2b-shards" -name 'year_*.json' -print -quit)"
      - name: Derive forward 60 and 120 session labels, compare B1 B2 B3 and MA120
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python research/v2b/validate.py --shards "${{ runner.temp }}/v2b-shards" --output research/v2b/results/validation_report.json
      - name: Preserve only computed evaluation statistics
        uses: actions/upload-artifact@v4
        with:
          name: v2b-forward-risk-report
          path: research/v2b/results/validation_report.json
          retention-days: 14
      - name: Commit computed report to isolated research branch
        if: github.ref == 'refs/heads/research/v2b-risk-validation-20261125'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v2b/results/validation_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(v2b): publish forward risk validation summary'
            git push origin HEAD:research/v2b-risk-validation-20261125
          fi
