name: Industry radar daily refresh
on:
  push:
    branches: [main, release/radar-earlier-refresh]
    paths:
      - 'radar/**'
      - 'industry-radar.js'
      - 'radar-view.js'
      - 'radar-ui.css'
      - 'tests/test_radar_view.cjs'
      - 'tests/test_radar_fixed_key.cjs'
      - 'index.html'
      - 'sw.js'
      - 'snapshot-store.js'
      - 'tests/test_snapshot_store.cjs'
      - '.github/workflows/industry-radar-daily.yml'
  pull_request:
    branches: [main]
    paths: ['radar/**','industry-radar.js','radar-view.js','radar-ui.css','tests/test_radar_view.cjs','tests/test_radar_fixed_key.cjs','index.html','sw.js','snapshot-store.js','tests/test_snapshot_store.cjs','.github/workflows/industry-radar-daily.yml']
  schedule:
    # Beijing 18:15, 19:15, 20:15, 21:10; retry only if current snapshot is not authenticated.
    - cron: '15 10,11,12 * * 1-5'
    - cron: '10 13 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m unittest discover -s tests -v
          python -m py_compile radar/build_v11.py radar/model_v11.py radar/view_v11.py
          node --check industry-radar.js
          node --check radar-view.js
          node tests/test_radar_view.cjs
          node tests/test_radar_fixed_key.cjs
          node --check snapshot-store.js
          node tests/test_snapshot_store.cjs
          node --check sw.js
          node radar/encrypt.mjs --test
  refresh:
    # Explicit recovery commits on main can refresh without a manual UI dispatch.
    # Ordinary pushes and pull requests still run tests only.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-refresh]')))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: a-share-quotes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check personal encryption key configuration
        env:
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python - <<'PY'
          import os,re
          if not re.fullmatch(r"[0-9a-fA-F]{64}",os.environ.get("RADAR_KEY","")):
              raise SystemExit("Setup required: configure RADAR_KEY from the personal radar page. No market data downloaded.")
          if not os.environ.get("TUSHARE_TOKEN"):
              raise SystemExit("TUSHARE_TOKEN missing.")
          PY
      - name: Skip scheduled retry if today's authenticated snapshot exists
        id: gate
        env:
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch origin main
          node --input-type=module - <<'JS'
          import {appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          let skip=false;
          if(process.env.EVENT_NAME==='schedule'){
            try{
              const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replaceAll('-','');
              const s=JSON.parse(execFileSync('git',['show','origin/main:data/industry_radar.enc.json'],{maxBuffer:10000000,stdio:['ignore','pipe','ignore']}));
              if(s.version===1&&s.asof===today){
                const key=await crypto.subtle.importKey('raw',Buffer.from(process.env.RADAR_KEY,'hex'),'AES-GCM',false,['decrypt']);
                const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:Buffer.from(s.iv,'base64'),additionalData:new TextEncoder().encode('northstar-radar-v1:'+s.asof),tagLength:128},key,Buffer.from(s.ciphertext,'base64'));
                const m=new TextDecoder().decode(plain).match(/<script type="application\/json" id="data">([\s\S]*?)<\/script>/);
                skip=!!m&&JSON.parse(m[1]).asof===today;
              }
            }catch{ /* Missing/stale/unverifiable snapshot: retry. */ }
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'skip='+skip+'\n');
          console.log(skip?'Today already published and authenticated; skip paid data scan.':'No verified current snapshot or manual refresh; proceed.');
          JS
      - name: Scan latest trading session (no historical retest)
        if: steps.gate.outputs.skip != 'true'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python radar/build_v11.py --daily --output "${{ runner.temp }}/radar-daily"
      - name: Encrypt locally and publish only authenticated ciphertext
        if: steps.gate.outputs.skip != 'true'
        env:
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/radar-daily"
          [ -f "$dir/radar_snapshot.json" ] || { echo "Non-trading day: no change"; exit 0; }
          node radar/encrypt.mjs "$dir" "$RUNNER_TEMP/radar.enc.json"
          rm -rf "$dir"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json,os
          from pathlib import Path
          src=Path(os.environ["RUNNER_TEMP"])/"radar.enc.json"
          dst=Path("data/industry_radar.enc.json")
          new=json.loads(src.read_text())
          if dst.exists() and json.loads(dst.read_text()).get("asof","")>new["asof"]:
              print("Preserve newer ciphertext.")
          else:
              dst.parent.mkdir(exist_ok=True)
              dst.write_bytes(src.read_bytes())
          PY
            git add data/industry_radar.enc.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data: update encrypted personal industry radar'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((2*n))"
          done
          exit 1
      - name: Remove temporary plaintext even after failure
        if: always()
        run: rm -rf "$RUNNER_TEMP/radar-daily"
