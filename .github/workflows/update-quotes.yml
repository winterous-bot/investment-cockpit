name: 每日A股行情快照
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_quotes.py'
      - 'scripts/update_market_signals.py'
      - 'scripts/breadth_model.py'
      - 'tests/**'
      - '.github/workflows/update-quotes.yml'
  schedule:
    # GitHub cron uses UTC: 08:23 UTC = 北京时间16:23，周一至周五（非交易日也会运行）
    - cron: '23 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: a-share-quotes
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline parser and market-model tests
        run: python -m unittest discover -s tests
      - name: Fetch A-share close snapshots
        run: python scripts/update_quotes.py
      - name: Calculate multi-horizon market breadth, sector-fallback and liquidity indicators
        run: python scripts/update_market_signals.py
      - name: Commit fresh public data (never upload private portfolio)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/quotes.json data/market_signals.json data/breadth_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update A-share quotes'
            git push
          fi
