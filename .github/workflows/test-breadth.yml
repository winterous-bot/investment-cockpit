name: 风险诊断模型回归测试
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'market-diagnostic.js'
      - '.github/workflows/test-breadth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python data model tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax and coverage regression
        run: |
          node --check market-diagnostic.js
          node --check app.js
          node --check risk-v2.js
          node tests/test-diagnostic.js
