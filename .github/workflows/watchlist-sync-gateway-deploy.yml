name: Deploy watchlist sync gateway (owner setup)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/watchlist-sync-gateway-deploy.yml']
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[gateway-repair]')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local code before deployment
        run: node tests/test_watchlist_sync.mjs
      - name: Deploy gateway and store derived authorization secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.WATCHLIST_DISPATCH_TOKEN }}
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import {createHmac} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const h=process.env.RADAR_KEY||'',token=process.env.GITHUB_DISPATCH_TOKEN||'';
          if(!/^[a-f0-9]{64}$/i.test(h)||!token||!process.env.CLOUDFLARE_API_TOKEN||!process.env.CLOUDFLARE_ACCOUNT_ID)throw Error('Required owner setup secrets missing');
          const auth=createHmac('sha256',Buffer.from(h,'hex')).update('northstar-watchlist-sync-auth-v12').digest('hex');
          writeFileSync(process.env.RUNNER_TEMP+'/watchlist-gateway-secrets.json',JSON.stringify({SYNC_AUTH_KEY:auth,GITHUB_DISPATCH_TOKEN:token}),{mode:0o600});
          JS
          unset RADAR_KEY GITHUB_DISPATCH_TOKEN
          trap 'rm -f "$RUNNER_TEMP/watchlist-gateway-secrets.json"' EXIT
          npx --yes wrangler@4 deploy --config worker/watchlist-wrangler.toml
          npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/watchlist-gateway-secrets.json" --config worker/watchlist-wrangler.toml
      - name: Verify deployed gateway with signed read-only request
        env:
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
        run: |
          node --input-type=module - <<'JS'
          import {createHmac} from 'node:crypto';
          const auth=createHmac('sha256',Buffer.from(process.env.RADAR_KEY,'hex')).update('northstar-watchlist-sync-auth-v12').digest();
          const raw=JSON.stringify({type:'probe'}),ts=String(Math.floor(Date.now()/1000));
          const sig=createHmac('sha256',auth).update(ts+'\n'+raw).digest('hex');
          const r=await fetch('https://investment-watchlist-sync.2306079301.workers.dev/v1/watchlist',{method:'POST',headers:{Origin:'https://winterous-bot.github.io','Content-Type':'application/json','X-Sync-Time':ts,'X-Sync-Signature':sig},body:raw,signal:AbortSignal.timeout(25000),redirect:'error'});
          const d=await r.json();
          console.log(JSON.stringify({check:'signed_live_gateway',status:r.status,state:d.state==='configured'?'configured':undefined,version:Number.isInteger(d.version)?d.version:undefined,error:['upstream','unauthorized','not_configured','invalid'].includes(d.error)?d.error:undefined,stage:['workflow','workflow_metadata','workflow_runs'].includes(d.stage)?d.stage:undefined,github_status:Number.isInteger(d.github_status)?d.github_status:undefined,network_error:['timeout','transport'].includes(d.network_error)?d.network_error:undefined}));
          if(!r.ok||d.state!=='configured'||d.version!==2)process.exitCode=1;
          JS
      - name: Clean deployment secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/watchlist-gateway-secrets.json"
