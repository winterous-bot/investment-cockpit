<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0b1324">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="投资驾驶舱">
  <meta name="description" content="长期赛道、目标买价、仓位预算、融资风控和每日行情一屏掌握。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="stylesheet" href="./style.css?v=1.7.0">
  <title>投资决策驾驶舱</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-symbol"><span></span><span></span><span></span></div>
        <div><div class="brand-overline">NORTHSTAR / PERSONAL INVESTING</div><div class="brand-name">投资决策驾驶舱</div></div>
      </div>
      <button id="refreshTop" class="icon-button" aria-label="刷新行情" title="刷新行情">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.8 9A7 7 0 0 1 18.2 7L20 12M4 12l1.8 5A7 7 0 0 0 18 15"/></svg>
      </button>
    </header>
    <main id="app" role="main" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-link active" data-tab="overview"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M3 13h7V3H3zM14 21h7V9h-7zM3 21h7v-4H3zM14 3h7v2h-7z"/></svg></span><span>总览</span></button>
      <button class="nav-link" data-tab="watch"><span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4M8 11h6M11 8v6"/></svg></span><span>观察池</span></button>
      <button class="nav-link" data-tab="holdings"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M3 7h18v14H3zM3 10h18M7 4h12v3M7 16h5"/></svg></span><span>持仓</span></button>
      <button class="nav-link" data-tab="rules"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4 18V8m8 10V4m8 14v-7M2 18h20"/></svg></span><span>风控规则</span></button>
      <button class="nav-link" data-tab="settings"><span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19 13 2-1-2-1-.6-2 1-2-2-2-2 1-2-.6-1-2-1 2-2 .6-2-1-2 2 1 2L5 11l-2 1 2 1 .6 2-1 2 2 2 2-1 2 .6 1 2 1-2 2-.6 2 1 2-2-1-2z"/></svg></span><span>设置</span></button>
    </nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <script src="./live-quotes.js" defer></script>
  <script src="./app.js?v=1.7.0" defer></script>
  <script src="./risk-v2.js?v=1.7.0" defer></script>
  <script src="./market-diagnostic.js?v=1.7.0" defer></script>
  <script src="./industry-radar.js?v=1.8.0" defer></script>
</body>
</html>
