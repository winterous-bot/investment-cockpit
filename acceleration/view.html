<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盈利加速股扫描器 V1.0</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#090f1c;color:#e6edf6;font:15px/1.5 system-ui,sans-serif;max-width:840px;margin:auto;padding:16px}h1{font-size:23px;margin:6px 0}h2{font-size:17px}h3{font-size:15px;margin:5px 0}.panel{background:#111e31;border:1px solid #283c55;border-radius:12px;padding:12px;margin:12px 0}.muted{color:#9eb1c8;font-size:12px}button,input{font:inherit;color:inherit;background:#1c3045;border:1px solid #39536a;border-radius:8px;padding:9px}button{cursor:pointer}input{width:100%}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}.tabs button{min-width:0;padding:8px 3px;font-size:13px}.tabs button.active{background:#b8a4eb;color:#24183d;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{overflow-wrap:anywhere}.metric span{display:block;font-size:12px;color:#9eb1c8}.metric b{font-size:17px}.stock{padding:12px 0;border-bottom:1px solid #283c55}.stock:last-child{border-bottom:0}.line{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.line strong{font-size:20px}.quarters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:10px 0}.quarters div{background:#0d1828;border-radius:8px;padding:7px}.quarters span{display:block;font-size:11px;color:#9eb1c8}.quarters b{font-size:17px;color:#81d4da}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #283c55;padding:6px 2px;text-align:right}td:first-child,th:first-child{text-align:left}details summary{cursor:pointer;color:#81d4da}[hidden]{display:none!important}
</style></head><body><p class="muted">NORTHSTAR / EARNINGS ACCELERATION · RESEARCH</p><h1>盈利加速股扫描器 V1.0</h1><p class="muted">研究原型 · 扣非业绩加速，不构成买卖信号</p><section class="panel" id="unlock"><label>输入现有固定密钥<input id="key" type="password" autocomplete="off" spellcheck="false"></label><p class="muted">仅在本机临时解密，不保存、不发送。</p><button id="open">解密报告</button><p id="error" role="status"></p></section><main id="main" hidden><section class="panel" id="health"></section><section class="panel"><h2>盈利加速信号</h2><div class="tabs" id="tabs"></div><p class="muted" id="desc"></p><input type="search" id="search" placeholder="搜索公司或行业"><h2 id="count"></h2><div id="rows"></div><button id="more" hidden>显示更多</button></section><section class="panel"><details><summary>历史验证：加速组 vs 同数量高增长组</summary><p class="muted">公告日期过滤；2022年起；非严格点时数据库，未计交易费用、涨跌停及缺失退市回款。按报告期等权，不承诺收益。</p><div id="results"></div></details></section></main><script type="application/json" id="cipher">__CIPHER__</script><script>
'use strict';
const $=id=>document.getElementById(id),el=(tag,t,c)=>{const x=document.createElement(tag);if(t!==undefined)x.textContent=t;if(c)x.className=c;return x};
let data=null,mode='all',limit=30;
const pct=v=>v==null?'—':(v*100).toFixed(1)+'%',pp=v=>v==null?'—':(v>0?'+':'')+(v*100).toFixed(1)+'pp',n=v=>v==null?'—':v.toFixed(2);
const modes=[['all','全部信号'],['early','加速初现'],['sustained','持续加速']];
const descriptions={all:'统一质量门槛：营收同比≥10%、扣非利润率同比改善≥1pp、TTM经营现金流/合并净利润≥80%。两类信号互斥，持续加速优先。',early:'最新扣非同比≥20%，前季同比<20%，增速改善≥20pp。',sustained:'最新扣非同比≥30%，最近两个季度的增速分别改善至少10pp、5pp。'};
function metric(label,value){const x=el('div',undefined,'metric');x.append(el('span',label),el('b',value));return x}
function table(headers,rows){const t=el('table'),h=el('tr');headers.forEach(x=>h.append(el('th',x)));t.append(h);for(const row of rows){const r=el('tr');row.forEach(x=>r.append(el('td',x)));t.append(r)}return t}
function card(x){const s=el('div',undefined,'stock'),h=el('div',undefined,'line');h.append(el('b',x.name+' '+x.code),el('strong',x.close==null?'—':n(x.close)+' 元'));s.append(h,el('p',x.industry+' · '+(x.signal==='early'?'加速初现':'持续加速')+' · PE-TTM '+(x.pe>0?n(x.pe):'—')+' · 市值 '+n(x.market_cap)+' 亿','muted'));
const q=el('div',undefined,'quarters');for(const t of x.history){const d=el('div');d.append(el('span',t.period),el('b',pct(t.profit_yoy)),el('span','扣非 '+n(t.profit)+' 亿'));q.append(d)}s.append(q);
const g=el('div',undefined,'grid');g.append(metric('本季利润增速改善',pp(x.acceleration)),metric('前季利润增速改善',pp(x.prior_acceleration)),metric('本季营收同比',pct(x.revenue_growth)),metric('本季扣非利润率改善',pp(x.margin_change)),metric('TTM现金转化率',pct(x.cash_conversion)),metric('本季扣非利润率',pct(x.history.at(-1).margin)));s.append(g);return s}
function render(){if(!data)return;const q=$('search').value.trim();const all=data.rows.filter(x=>mode==='all'||x.signal===mode);const rows=all.filter(x=>!q||[x.name,x.code,x.industry].some(v=>String(v).includes(q)));$('count').textContent='符合 '+all.length+' 家 · 显示 '+Math.min(limit,rows.length)+' / '+rows.length;$('desc').textContent=descriptions[mode];$('rows').replaceChildren(...rows.slice(0,limit).map(card));$('more').hidden=rows.length<=limit;for(const b of $('tabs').children){b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))}}
function mount(x){data=x;const r=x.report;$('health').append(el('h2','数据覆盖'),el('p','行情日期 '+r.quote_date+' · 财报期 '+r.report_period),el('p','当前范围 '+r.current_scan.scope+' 家 · 质量门槛通过 '+r.current_scan.quality_eligible+' 家 · 加速候选 '+x.rows.length+' 家','muted'),el('p','历史单季同比使用累计财报拆分；排除低基数（去年同季扣非≥1000万元且利润率≥1%）及亏损，避免虚假加速。','muted'));for(const [id,label] of modes){const b=el('button',label+' '+x.rows.filter(v=>id==='all'||v.signal===id).length);b.dataset.mode=id;b.onclick=()=>{mode=id;limit=30;render()};$('tabs').append(b)}for(const [id,label] of [['early','加速初现'],['sustained','持续加速'],['union','全部信号']]){const a=r.summary[id];$('results').append(el('h3',label),table(['验证指标','有效期数','信号组中位','基线组中位','期内差中位'],[['next_q_growth','下季扣非同比'],['second_q_growth','下下季扣非同比'],['return20','20日收益'],['return60','60日收益']].map(([k,t])=>[t,a[k].cohorts_valid+'/'+a[k].cohorts_total,pct(a[k].median_cohort_signal_median),pct(a[k].median_cohort_baseline_median),pp(a[k].median_cohort_median_gap)])))}$('main').hidden=false;$('unlock').hidden=true;render()}
$('search').oninput=()=>{limit=30;render()};$('more').onclick=()=>{limit+=30;render()};
$('open').onclick=async()=>{try{const h=$('key').value.trim();if(!/^[0-9a-fA-F]{64}$/.test(h))throw Error('请输入原固定密钥');const x=JSON.parse($('cipher').textContent),d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const key=await crypto.subtle.importKey('raw',Uint8Array.from(h.match(/../g),a=>parseInt(a,16)),'AES-GCM',false,['decrypt']);const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(x.iv),additionalData:new TextEncoder().encode('northstar-acceleration-v1:'+x.asof),tagLength:128},key,d(x.ciphertext));const s=JSON.parse(new TextDecoder().decode(raw));if(s.report.version!=='earnings-acceleration-v1.0'||s.report.asof!==x.asof||!Array.isArray(s.rows))throw Error('数据版本或日期错误');$('key').value='';mount(s)}catch(e){$('error').textContent='无法读取：'+(e.name==='OperationError'?'请核对原固定密钥':e.message)}};
</script></body></html>
