<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高质量成长股扫描器 V1.2</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#090f1c;color:#e6edf6;font:15px/1.5 system-ui,sans-serif;max-width:900px;margin:auto;padding:16px}h1{font-size:24px}h2{font-size:18px}.panel{background:#111e31;border:1px solid #283c55;border-radius:12px;padding:14px;margin:12px 0}.muted{font-size:12px;color:#9eb1c8}button,input,select{font:inherit;color:inherit;background:#1c3045;border:1px solid #39536a;border-radius:8px;padding:9px}button{cursor:pointer}input[type=number]{width:100%}input[type=password],input[type=search]{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block}.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}.presets button{padding:9px 4px;font-size:13px;white-space:normal}.presets button.active{background:#81d4da;color:#0b2531;font-weight:700}.presets small{display:block;font-weight:400;font-size:11px}.valuation{background:#0d1828;border:1px solid #283c55;border-radius:10px;padding:10px;margin:10px 0}.price-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.price-line strong{font-size:22px;color:#e6edf6}.reference{border-top:1px solid #283c55;margin-top:9px;padding-top:8px}.reference b{display:block;font-size:17px}.reference .muted{display:block}.discount{font-size:13px;margin-top:4px}.stock{border-bottom:1px solid #283c55;padding:12px 0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}.metric b{display:block}.metric span{font-size:11px;color:#9eb1c8}strong{color:#81d4da}a{color:#81d4da}[hidden]{display:none!important}
</style><h1>高质量成长股扫描器 V1.2</h1><p class="muted">独立研究原型 · 已披露财务数据 · 非买入信号</p><section class="panel" id="unlock"><label>输入现有雷达固定密钥<input type="password" id="key" autocomplete="off" spellcheck="false"></label><p class="muted">只用于本次本地解密，不保存或发送。正式工具的密钥机制未更改。</p><button id="open">解密研究报告</button><p id="error" role="status"></p></section><main hidden id="main"><section class="panel"><h2>数据覆盖</h2><div id="health"></div></section><section class="panel"><h2>筛选场景</h2><div class="presets" id="presets"></div><p class="muted" id="sceneNote"></p><div class="grid" id="filters"></div><p><label><input type="checkbox" id="value"> 同时限定正PE-TTM上限（好价格独立筛选）</label></p><button id="reset">恢复当前场景参数</button></section><section class="panel"><h2 id="count"></h2><label>搜索公司或行业<input id="query" type="search"></label><label>排序 <select id="sort"><option value="roic">ROIC从高到低</option><option value="revenue_cagr">营收CAGR从高到低</option><option value="deducted_yoy">扣非增长从高到低</option><option value="cash_conversion">现金转化从高到低</option><option value="pe">PE从低到高</option><option value="hist_discount">历史估值折价从大到小</option><option value="peer_discount">可比公司估值折价从大到小</option></select></label><div id="rows"></div><button id="more" hidden>显示更多</button></section></main><script type="application/json" id="cipher">__CIPHER__</script><script>
const $=id=>document.getElementById(id), node=(tag,t,c)=>{const x=document.createElement(tag);if(t!==undefined)x.textContent=t;if(c)x.className=c;return x};let data=null,limit=50,scene="balanced";
const fields=[['revenue_cagr','3年营收CAGR下限（%）',100],['deducted_yoy','扣非TTM增长下限（%）',100],['roic','年度ROIC下限（%）',100],['cash_conversion','经营现金流/净利润下限（%）',100],['debt_ratio','资产负债率上限（%）',100],['pe','PE-TTM上限（倍）',1]];
const pct=x=>x==null?'—':(x*100).toFixed(1)+'%',num=x=>x==null?'—':x.toFixed(1);
function choose(id){scene=id;const p=data.report.presets.find(x=>x.id===id);if(!p)throw Error('场景配置缺失');for(const [k,_,s] of fields)$(k).value=+(p.limits[k]*s).toFixed(6);$('value').checked=p.valuation;$('sort').value=p.sort;$('query').value='';limit=50;render()}
function reset(){choose(scene)}
function sceneStatus(){
 const p=data.report.presets.find(x=>x.id===scene);
 const custom=fields.some(([k,_,s])=>Math.abs($(k).valueAsNumber/s-p.limits[k])>1e-8||!Number.isFinite($(k).valueAsNumber))||$('value').checked!==p.valuation;
 $('sceneNote').textContent=p.description+(custom?' · 已手动调整参数':' · 使用预设参数')+'；估值上限仅在勾选时生效。';
 for(const b of $('presets').children){b.classList.toggle('active',b.dataset.id===scene);b.setAttribute('aria-pressed',String(b.dataset.id===scene))}
}
function createPresets(){const stats=data.report.preset_statistics.scenarios;for(const p of data.report.presets){const b=node('button',p.label);b.type='button';b.dataset.id=p.id;b.setAttribute('aria-pressed','false');const s=stats.find(x=>x.id===p.id);b.append(node('small','预设 '+s.quality_count+' 家'));b.onclick=()=>choose(p.id);$('presets').append(b)}}
function valuationCard(x){
 const v=x.valuation||{},out=node('div',undefined,'valuation'),line=node('div',undefined,'price-line');
 const yuan=n=>n==null?'—':n.toFixed(2)+' 元';
 line.append(node('span','最新收盘价','muted'),node('strong',yuan(v.close)));out.append(line,node('div',v.quote_date?'行情日期 '+v.quote_date+' · 非盘中实时':'暂无有效收盘价','muted'));
 function anchor(title,ref,info,missing){
  const box=node('div',undefined,'reference');box.append(node('span',title,'muted'));
  if(!ref){box.append(node('span',missing,'muted'));out.append(box);return}
  box.append(node('b',ref.price[0].toFixed(2)+'–'+ref.price[2].toFixed(2)+' 元'),node('span','中位参照 '+yuan(ref.price[1])+' · '+ref.multiple[0].toFixed(1)+'–'+ref.multiple[2].toFixed(1)+' 倍','muted'),node('div',(ref.relative_to_median<=0?'较中位折价 ':'较中位溢价 ')+pct(Math.abs(ref.relative_to_median)),'discount'),node('span',info,'muted'));
  out.append(box);
 }
 anchor('历史PE参考区间（P25–P75）',v.historical,v.historical?'正PE样本 '+v.historical.n+'/36 · 当前历史分位 '+pct(v.historical.percentile):'','历史正PE样本不足或价格/股本未通过校验');
 anchor('匹配同行扣非PE参考区间（P25–P75）',v.peer,v.peer?'匹配 '+v.peer.n+' 家 · '+v.peer.industry:'','相似同行不足8家或价格/股本未通过校验');
 if(!v.peer&&v.industry_context)out.append(node('p','仅供背景：同分类 '+v.industry_context.n+' 家扣非PE中位 '+num(v.industry_context.median)+' 倍；不生成参考价格。','muted'));
 if(v.earnings_basis_warning)out.append(node('p','普通与扣非PE差异较大，请核查非经常性损益或利润口径。','muted'));
 out.append(node('p','相对估值区间不是目标价或内在价值。两种方法利润口径不同，不作平均。','muted'));return out;
}
function render(){if(!data)return;sceneStatus();$('pe').disabled=!$('value').checked;const lim={};for(const [k,_,s] of fields){const v=$(k).valueAsNumber;if(!Number.isFinite(v)||(k==='pe'&&v<=0)||(k==='debt_ratio'&&(v<0||v>100))){$('count').textContent='请输入有效筛选条件';$('rows').replaceChildren();return}lim[k]=v/s}
const q=$('query').value.trim(),k=$('sort').value;const all=data.rows.filter(x=>fields.slice(0,4).every(([f])=>x[f]!=null&&x[f]>=lim[f])&&x.debt_ratio!=null&&x.debt_ratio<=lim.debt_ratio&&(!$('value').checked||(x.pe>0&&x.pe<=lim.pe)));
const selected=all.filter(x=>!q||[x.name,x.code,x.industry].some(v=>String(v).includes(q)));const discount=x=>x.valuation?.[k==='hist_discount'?'historical':'peer']?.relative_to_median??Infinity;selected.sort((a,b)=>k==='pe'?(a.pe??Infinity)-(b.pe??Infinity):k==='hist_discount'||k==='peer_discount'?discount(a)-discount(b):b[k]-a[k]);$('count').textContent='符合条件 '+all.length+' 家 · 当前显示 '+Math.min(limit,selected.length)+' / '+selected.length+' 家';$('rows').replaceChildren();for(const x of selected.slice(0,limit)){const r=node('div',undefined,'stock');r.append(node('b',x.name+' '+x.code),node('div',x.industry+' · 市值 '+num(x.market_cap)+' 亿元','muted'));const g=node('div',undefined,'metrics');for(const [name,v] of [['营收CAGR',pct(x.revenue_cagr)],['扣非增长',pct(x.deducted_yoy)],['ROIC',pct(x.roic)],['现金转化',pct(x.cash_conversion)],['负债率',pct(x.debt_ratio)],['PE-TTM',num(x.pe)],['扣非PE',num(x.deducted_pe)],['扣非TTM(亿)',num(x.deducted_ttm)],['简化FCF(亿)',num(x.fcf_proxy)]]){const d=node('div',undefined,'metric');d.append(node('span',name),node('b',v));g.append(d)}r.append(g,valuationCard(x));$('rows').append(r)}$('more').hidden=selected.length<=limit;}
$('open').onclick=async()=>{try{const hex=$('key').value.trim();if(!/^[a-fA-F0-9]{64}$/.test(hex))throw Error('请输入原有64位固定密钥');const x=JSON.parse($('cipher').textContent),dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),key=await crypto.subtle.importKey('raw',Uint8Array.from(hex.match(/../g),h=>parseInt(h,16)),'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(x.iv),additionalData:new TextEncoder().encode('northstar-growth-v1:'+x.asof),tagLength:128},key,dec(x.ciphertext));data=JSON.parse(new TextDecoder().decode(plain));if(data.report.asof!==x.asof)throw Error('日期校验失败');$('key').value='';$('unlock').hidden=true;$('main').hidden=false;const r=data.report;$('health').replaceChildren(node('p',r.data_coverage_pass?'数据覆盖检查通过':'覆盖不足：仅供诊断，不代表完整市场','muted'),node('p','估值日期 '+r.quote_date+' · 财报期 '+r.periods.latest),node('p','沪深上市 '+r.listed_shsz+' · 工商业样本 '+r.industrial_commercial+' · 指标完整 '+r.complete_metrics),node('p','默认质量通过 '+r.quality_pass+' · 同时满足估值 '+r.quality_and_valuation_pass));for(const [k,label,s] of fields){const l=node('label',label),i=node('input');i.id=k;i.type='number';i.step='any';i.oninput=()=>{limit=50;render()};l.append(i);$('filters').append(l)}createPresets();choose('balanced')}catch(e){$('error').textContent='无法读取报告：'+(e.name==='OperationError'?'请核对固定密钥':e.message)}};
$('reset').onclick=reset;$('query').oninput=()=>{limit=50;render()};$('sort').onchange=()=>{limit=50;render()};$('value').onchange=()=>{limit=50;render()};$('more').onclick=()=>{limit+=50;render()};
</script></html>
